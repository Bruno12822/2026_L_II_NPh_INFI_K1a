version: 2.1

jobs:
  build-and-test:
    machine:
      image: ubuntu-2004:current
        
    steps:
      - checkout
      - run:
          name: Instalacja narzedzi systemowych i zaleznosci
          command: |
            sudo apt-get update && sudo apt-get install -y make
            pip install -r requirements.txt
            pip install -r test_requirements.txt
      - run:
          name: Uruchomienie lintera
          command: make lint
      - run:
          name: Uruchomienie testów
          command: make test

workflows:
  basic:
    jobs:
      - build-and-test